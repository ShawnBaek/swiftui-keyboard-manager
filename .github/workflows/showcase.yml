name: Update app showcase
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Documentation/apps.json, Scripts/UpdateShowcase.swift]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift Scripts/UpdateShowcase.swift
      - name: Commit rendered showcase
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: Update app showcase"
            git push
          fi
